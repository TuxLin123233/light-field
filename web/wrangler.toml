name = "light-field"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

# 房间状态用 Durable Object：单线程串行处理，写入立即可见，
# 不会出现 KV 最终一致导致的「有人凭空消失 / 落笔不同步」。
#
# 注意：Pages 项目的 wrangler.toml 不支持 [[migrations]]，
# Durable Object 的类会随 Pages 部署一起注册，无需在这里声明迁移。
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomServer"
script_name = "durable/room-server"
