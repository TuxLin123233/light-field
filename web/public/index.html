<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素小镇</title>
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('lw-theme')
          if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', t)
          if (localStorage.getItem('lw-glass') === '0') document.documentElement.classList.add('glass-off')
        } catch (e) {}
      })()
    </script>
    <style>
      /* hidden 属性兜底：避免类选择器里的 display 覆盖 UA 的 [hidden]{display:none} */
      [hidden] { display: none !important; }

      :root {
        --bg: linear-gradient(160deg, #fdf8f2 0%, #f2ece2 100%);
        --surface: #fff;
        --surface-2: #efe9e0;
        --surface-3: #f0ece4;
        --art-bg: #fff;
        --text: #3b342c;
        --text-muted: #6b5f50;
        --text-muted2: #9a8c7a;
        --text-faint: #b0a697;
        --text-report: #8c7f6b;
        --border: #efe7da;
        --border-strong: #e0d3c0;
        --border-input: #e0d8d0;
        --ring: #fff;
        --shadow1: rgba(80, 60, 40, 0.15);
        --shadow2: rgba(80, 60, 40, 0.10);
        --shadow3: rgba(80, 60, 40, 0.06);
        --shadow-hover: rgba(80, 60, 40, 0.14);
        --accent: #5b8def;
        --toast-bg: #3b342c;
        --tip-text: #d1944d;
        --tip-btn-border: #f0e2cf;
        --blacktip-bg: #fff8ef;
        --blacktip-border: #f0e2cf;
        --blacktip-text: #b97f3a;
        --like: #e5574b;
        --like-bg: #fff1ee;
        --like-border: #eec9c2;
      }
      [data-theme="dark"] {
        --bg: linear-gradient(160deg, #211c17 0%, #18140f 100%);
        --surface: #2a251f;
        --surface-2: #38312a;
        --surface-3: #322c25;
        --art-bg: #f6f2ea;
        --text: #f1ead9;
        --text-muted: #c5baa7;
        --text-muted2: #a39582;
        --text-faint: #857b68;
        --text-report: #97896d;
        --border: #4a4238;
        --border-strong: #5e5448;
        --border-input: #554b3e;
        --ring: #2a251f;
        --shadow1: rgba(0, 0, 0, 0.30);
        --shadow2: rgba(0, 0, 0, 0.22);
        --shadow3: rgba(0, 0, 0, 0.16);
        --shadow-hover: rgba(0, 0, 0, 0.55);
        --accent: #76a3ff;
        --toast-bg: #3e372e;
        --tip-text: #e8b970;
        --tip-btn-border: #4e3a20;
        --blacktip-bg: #2b2316;
        --blacktip-border: #4e3a20;
        --blacktip-text: #eec27d;
        --like: #ff8577;
        --like-bg: #3d231f;
        --like-border: #5e352c;
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      html { background: var(--bg); }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        padding: 16px 16px 112px;
        transition: background 0.25s ease, color 0.25s ease;
      }

      /* 路由出口用 display:contents 彻底"透明"：
         各视图的根元素直接参与 body 的布局，与迁移前的单文件页面完全一致。
         （外壳不设 display:flex，因为原本只有画板/联机/管理是 flex 布局，
           社区/日志/设置原本是块级布局，强行统一会导致宽度算错） */
      #siteRoot { display: contents; }

      /* ---------- 底部导航（全局壳，四个页面共用） ---------- */
      .bottom-nav {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 80;
        display: flex;
        align-items: center;
        gap: 2px;
        width: min(420px, calc(100% - 36px));
        padding: 8px 12px;
        background: rgba(255, 253, 250, 0.66) !important;
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(180, 168, 150, 0.30) !important;
        border-radius: 999px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      [data-theme="dark"] .bottom-nav {
        background: rgba(42, 38, 33, 0.62) !important;
        border-color: rgba(255, 255, 255, 0.10) !important;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      html.glass-off .bottom-nav,
      html.glass-off [data-theme="dark"] .bottom-nav {
        background: var(--surface) !important;
        border-color: var(--border) !important;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }

      @keyframes glassJelly {
        0%   { transform: translateX(-50%) scale(1, 0.98) translateY(5px); }
        30%  { transform: translateX(-50%) scale(1.04, 0.99) translateY(-4px); }
        55%  { transform: translateX(-50%) scale(0.985, 1.012) translateY(3px); }
        78%  { transform: translateX(-50%) scale(1.01, 0.997) translateY(-1px); }
        100% { transform: translateX(-50%) scale(1, 1) translateY(0); }
      }
      .bottom-nav.jelly { animation: glassJelly 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
      @keyframes switchWobble {
        0%   { transform: scale(1); }
        40%  { transform: scale(1.18) rotate(-5deg); }
        70%  { transform: scale(0.94) rotate(2deg); }
        100% { transform: scale(1) rotate(0); }
      }
      .switch.jelly { animation: switchWobble 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

      .bottom-nav a {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 7px 0 6px;
        border-radius: 14px;
        text-decoration: none;
        color: var(--text-faint);
        font-size: 10px;
        font-weight: 700;
        transition: color 0.2s, background 0.2s;
      }
      .bottom-nav a .nav-icon { font-size: 18px; line-height: 1; }
      .bottom-nav a.active { color: var(--accent); background: var(--surface-2); }

      /* ---------- 全局提示 ---------- */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 96px;
        transform: translate(-50%, 0);
        z-index: 120;
        max-width: 86vw;
        padding: 10px 18px;
        border-radius: 12px;
        background: var(--toast-bg);
        color: #f5f0e6;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s, transform 0.25s;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
    </style>
    <style id="view-style"></style>
    <script src="/vue.global.prod.js"></script>
    <script src="/vue-router.global.prod.js"></script>
    <script src="/omggif.js"></script>
    <script src="/qrcode.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
