    <title>像素小镇</title>
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('lw-theme')
          if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', t)
          /* data-mood 只分「明 / 暗」两类。视图里凡是「暗色下要换个背景」的地方
             一律用 [data-mood="dark"]，别用 [data-mood="dark"] ——
             暗色主题有 8 个，只有 id 叫 dark 的那个会被前者命中，
             其余 7 个（夜阑/深海/墨林/玫瑰夜/森语/夜航/炭）会保持浅色背景
             配浅色文字，基本看不清。 */
          document.documentElement.setAttribute('data-mood', /night|midnight|ink|charcoal|rose|forest|dark/.test(t) ? 'dark' : 'light')
          if (localStorage.getItem('lw-glass') === '0') document.documentElement.classList.add('glass-off')
        } catch (e) {}
      })()
    </script>
    <style>
      /* hidden 属性兜底：避免类选择器里的 display 覆盖 UA 的 [hidden]{display:none} */
      [hidden] { display: none !important; }

      /* 加载动画：一个小方块在轨道里左右来回走。
         颜色只用 var(--accent)，主题一变它就跟着变，不用为每个主题单独写。 */
      @keyframes lwSlide {
        0%   { transform: translateX(0); }
        50%  { transform: translateX(calc(var(--lw-run, 44px) - 10px)); }
        100% { transform: translateX(0); }
      }
      .lw-load {
        --lw-run: 44px;
        display: inline-block;
        vertical-align: -2px;
        width: 46px;
        height: 10px;
        margin-right: 7px;
        position: relative;
        border-radius: 999px;
        background: color-mix(in srgb, var(--accent) 16%, transparent);
      }
      .lw-load::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--accent);
        animation: lwSlide 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      /* 尊重「减少动态效果」的系统设置 */
      @media (prefers-reduced-motion: reduce) {
        .lw-load::before { animation: none; }
      }

      :root {
        --bg: linear-gradient(160deg, #fdf8f2 0%, #f2ece2 100%);
        --surface: #fff;
        --surface-2: #efe9e0;
        --surface-3: #f0ece4;
        --art-bg: #fff;
        --text: #3b342c;
        --text-muted: #6b5f50;
        --text-muted2: #9a8c7a;
        --text-faint: #b0a697;
        --text-report: #8c7f6b;
        --border: #efe7da;
        --border-strong: #e0d3c0;
        --border-input: #e0d8d0;
        --ring: #fff;
        --shadow1: rgba(80, 60, 40, 0.15);
        --shadow2: rgba(80, 60, 40, 0.10);
        --shadow3: rgba(80, 60, 40, 0.06);
        --shadow-hover: rgba(80, 60, 40, 0.14);
        --accent: #5b8def;
        --toast-bg: #3b342c;
        --tip-text: #d1944d;
        --tip-btn-border: #f0e2cf;
        --blacktip-bg: #fff8ef;
        --blacktip-border: #f0e2cf;
        --blacktip-text: #b97f3a;
        --like: #e5574b;
        --like-bg: #fff1ee;
        --like-border: #eec9c2;
        --nav-base: 255, 253, 250;
        /* 文字光晕色：浅色主题用白光，深色主题用黑光 */
        --nav-halo: 255, 255, 255;
      }
      [data-mood="dark"] {
        --bg: linear-gradient(160deg, #211c17 0%, #18140f 100%);
        --surface: #2a251f;
        --surface-2: #38312a;
        --surface-3: #322c25;
        --art-bg: #f6f2ea;
        --text: #f1ead9;
        --text-muted: #c5baa7;
        --text-muted2: #a39582;
        --text-faint: #857b68;
        --text-report: #97896d;
        --border: #4a4238;
        --border-strong: #5e5448;
        --border-input: #554b3e;
        --ring: #2a251f;
        --shadow1: rgba(0, 0, 0, 0.30);
        --shadow2: rgba(0, 0, 0, 0.22);
        --shadow3: rgba(0, 0, 0, 0.16);
        --shadow-hover: rgba(0, 0, 0, 0.55);
        --accent: #76a3ff;
        --toast-bg: #3e372e;
        --tip-text: #e8b970;
        --tip-btn-border: #4e3a20;
        --blacktip-bg: #2b2316;
        --blacktip-border: #4e3a20;
        --blacktip-text: #eec27d;
        --like: #ff8577;
        --like-bg: #3d231f;
        --like-border: #5e352c;
        --nav-base: 42, 38, 33;
        --nav-halo: 0, 0, 0;
      }

      /* ---------- 5 套特色主题 ---------- */
      html[data-theme="sakura"] {
        --bg: linear-gradient(160deg, #fdf2f5 0%, #f6e3ea 100%);
        --surface: #fffafb;
        --surface-2: #f7e7ec;
        --surface-3: #f2dde4;
        --art-bg: #fff;
        --text: #4a3540;
        --text-muted: #7d6470;
        --text-muted2: #a08d97;
        --text-faint: #bfa9b3;
        --border: #f2dde4;
        --border-strong: #e8c6d1;
        --border-input: #e4c2ce;
        --accent: #e0698a;
        --shadow1: rgba(150, 90, 110, 0.16);
        --shadow-hover: rgba(150, 90, 110, 0.18);
        --like: #e0576a;
        --like-bg: #fdeef1;
        --like-border: #f0c9d3;
        --nav-halo: 255, 255, 255;
      }
      html[data-theme="sea"] {
        --bg: linear-gradient(160deg, #f0f8fa 0%, #ddeef2 100%);
        --surface: #fbfeff;
        --surface-2: #e4f1f4;
        --surface-3: #d8eaee;
        --art-bg: #fff;
        --text: #2c3f47;
        --text-muted: #5a7079;
        --text-muted2: #8599a1;
        --text-faint: #a3b4ba;
        --border: #dcecef;
        --border-strong: #c3dee3;
        --border-input: #bfdbe1;
        --accent: #2f93a8;
        --shadow1: rgba(40, 100, 115, 0.15);
        --shadow-hover: rgba(40, 100, 115, 0.18);
        --like: #e05a6a;
        --like-bg: #fdeff1;
        --like-border: #f2ccd3;
      }
      html[data-theme="mint"] {
        --bg: linear-gradient(160deg, #f2f9f1 0%, #e2f1e3 100%);
        --surface: #fcfffc;
        --surface-2: #e6f2e6;
        --surface-3: #dcecdd;
        --art-bg: #fff;
        --text: #33452f;
        --text-muted: #5c705a;
        --text-muted2: #869a84;
        --text-faint: #a3b4a1;
        --border: #ddedde;
        --border-strong: #c3ddc5;
        --border-input: #bfd9c1;
        --accent: #3f9c5c;
        --shadow1: rgba(50, 110, 65, 0.15);
        --shadow-hover: rgba(50, 110, 65, 0.18);
        --like: #e0576a;
        --like-bg: #fdeff1;
        --like-border: #f2ccd3;
      }
      html[data-theme="sunset"] {
        --bg: linear-gradient(160deg, #fff6ec 0%, #fbe6d2 100%);
        --surface: #fffcf8;
        --surface-2: #fbeedd;
        --surface-3: #f7e3cf;
        --art-bg: #fff;
        --text: #4a3826;
        --text-muted: #7d6248;
        --text-muted2: #a08771;
        --text-faint: #bda189;
        --border: #f7e3cf;
        --border-strong: #eecfb0;
        --border-input: #ebc9a7;
        --accent: #d9823e;
        --shadow1: rgba(150, 100, 55, 0.16);
        --shadow-hover: rgba(150, 100, 55, 0.18);
        --like: #d9524a;
        --like-bg: #fdeeea;
        --like-border: #f2ccc4;
      }
      html[data-theme="midnight"] {
        --bg: linear-gradient(160deg, #191a2e 0%, #12131f 100%);
        --surface: #21223a;
        --surface-2: #2b2c48;
        --surface-3: #33345a;
        --art-bg: #f4f2ee;
        --text: #ece9f5;
        --text-muted: #b6b2cc;
        --text-muted2: #918ca8;
        --text-faint: #6f6a86;
        --border: #2e2f4c;
        --border-strong: #3d3e63;
        --border-input: #3a3b5e;
        --ring: #21223a;
        --shadow1: rgba(0, 0, 0, 0.34);
        --shadow2: rgba(0, 0, 0, 0.26);
        --shadow3: rgba(0, 0, 0, 0.18);
        --shadow-hover: rgba(0, 0, 0, 0.58);
        --accent: #8b7cf0;
        --toast-bg: #34355a;
        --like: #ff8f9c;
        --like-bg: #3a2436;
        --like-border: #553044;
        --nav-halo: 0, 0, 0;
      }

      /* ---------- PWA 安装提示条 ---------- */
      .pwa-tip {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: calc(74px + env(safe-area-inset-bottom, 0px));
        z-index: 900;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 11px 13px;
        border-radius: 14px;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        box-shadow: 0 6px 22px var(--shadow1);
        font-size: 13px;
        color: var(--text);
        max-width: 460px;
        margin: 0 auto;
      }
      .pwa-tip span { flex: 1; line-height: 1.5; }
      .pwa-go {
        padding: 7px 14px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
      }
      .pwa-x {
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        border-radius: 50%;
        border: none;
        background: var(--surface-2);
        color: var(--text-muted);
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
      }

            * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      html { background: var(--bg); overflow-x: clip; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        /* 不设这一行时 body 用浏览器默认的纯黑，深色模式下会变成黑字黑底 */
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        padding: 16px 16px 112px;
        transition: background 0.25s ease, color 0.25s ease;
        overflow-x: clip;
      }

      /* 让表单控件、滚动条也跟着主题走 */
      :root { color-scheme: light; }
      html[data-mood="dark"] { color-scheme: dark; }
      html[data-theme="midnight"] { color-scheme: dark; }

      /* 路由出口用 display:contents 彻底"透明"：
         各视图的根元素直接参与 body 的布局，与迁移前的单文件页面完全一致。
         （外壳不设 display:flex，因为原本只有画板/联机/管理是 flex 布局，
           社区/日志/设置原本是块级布局，强行统一会导致宽度算错） */
      #siteRoot { display: contents; }

      /* 关键：#app 是 Vue 挂载点，也是 body 的 flex 子项。
         align-items:center 会让它按内容宽度收缩（本项目最宽元素是 460px），
         于是页面内所有 width:100% 都相对 460px 解析，在窄屏上整体超宽。
         把它钉死为可视宽度，各视图的 width:100% 才会正确。 */
      #app {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* 兜底：极老浏览器不支持 display:contents 时，用 block+100% 保持同样宽度 */
      @supports not (display: contents) {
        #siteRoot { display: block; width: 100%;
        --nav-halo: 0, 0, 0;
      }
      }

      /* ---------- 底部导航（全局壳，四个页面共用） ---------- */
      .bottom-nav {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 80;
        display: flex;
        align-items: center;
        gap: 2px;
        width: min(420px, calc(100% - 36px));
        padding: 8px 12px;
        /* --nav-op 由设置页的滑块实时调节，0 = 完全透明，1 = 最实 */
        background: rgba(var(--nav-base, 255, 253, 250), var(--nav-op, 0.66)) !important;
        -webkit-backdrop-filter: blur(calc(6px + var(--nav-op, 0.66) * 22px)) saturate(180%);
        backdrop-filter: blur(calc(6px + var(--nav-op, 0.66) * 22px)) saturate(180%);
        border: 1px solid rgba(180, 168, 150, 0.30) !important;
        border-radius: 999px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      [data-mood="dark"] .bottom-nav {
        background: rgba(var(--nav-base, 42, 38, 33), var(--nav-op, 0.62)) !important;
        border-color: rgba(255, 255, 255, 0.10) !important;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      html.glass-off .bottom-nav,
      html.glass-off [data-mood="dark"] .bottom-nav {
        /* 关掉毛玻璃：仍按同一个不透明度混色，滑块依然有效 */
        background: color-mix(in srgb, var(--surface) calc(var(--nav-op, 0.66) * 100%), transparent) !important;
        border-color: var(--border) !important;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }

      @keyframes glassJelly {
        0%   { transform: translateX(-50%) scale(1, 0.98) translateY(5px); }
        30%  { transform: translateX(-50%) scale(1.04, 0.99) translateY(-4px); }
        55%  { transform: translateX(-50%) scale(0.985, 1.012) translateY(3px); }
        78%  { transform: translateX(-50%) scale(1.01, 0.997) translateY(-1px); }
        100% { transform: translateX(-50%) scale(1, 1) translateY(0); }
      }
      .bottom-nav.jelly { animation: glassJelly 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

      /* ---------- 导航栏样式：共 6 款，用 data-nav-style 切换 ----------
         玻璃(glass)为默认。其余 5 款覆盖背景、边框、阴影与高亮方式。
         原有规则用了 !important，所以这里也必须带 !important 才能覆盖。 */

      /* 实心：不透明色块，边界最清楚 */
      html[data-nav-style='solid'] .bottom-nav,
      html[data-nav-style='solid'][data-theme] .bottom-nav {
        background: var(--surface) !important;
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
        border-color: var(--border) !important;
        box-shadow: 0 6px 20px var(--shadow1, rgba(0, 0, 0, 0.08)) !important;
      }

      /* 描边：完全透明底，只留一圈细边 */
      html[data-nav-style='outline'] .bottom-nav,
      html[data-nav-style='outline'][data-theme] .bottom-nav {
        background: transparent !important;
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
        border-color: var(--border-strong) !important;
        box-shadow: none !important;
      }
      html[data-nav-style='outline'] .bottom-nav a.active {
        box-shadow: none !important;
        border-radius: 999px;
        outline: 1.5px solid var(--accent);
        outline-offset: -1.5px;
      }

      /* 药丸：底透明，只有当前页是个填充药丸 */
      html[data-nav-style='pill'] .bottom-nav,
      html[data-nav-style='pill'][data-theme] .bottom-nav {
        background: transparent !important;
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
        border-color: transparent !important;
        box-shadow: none !important;
        padding: 6px 10px !important;
      }
      html[data-nav-style='pill'] .bottom-nav a.active {
        background: var(--accent) !important;
        color: #fff !important;
        box-shadow: none !important;
        text-shadow: none !important;
        border-radius: 999px !important;
      }

      /* 分段：四格之间用竖线分隔，像经典 tabbar */
      html[data-nav-style='segmented'] .bottom-nav,
      html[data-nav-style='segmented'][data-theme] .bottom-nav {
        background: var(--surface) !important;
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
        border-color: var(--border) !important;
        border-radius: 16px !important;
        box-shadow: 0 4px 14px var(--shadow1, rgba(0, 0, 0, 0.07)) !important;
        padding: 6px 8px !important;
        gap: 0 !important;
      }
      html[data-nav-style='segmented'] .bottom-nav a {
        border-radius: 10px;
        border-right: 1px solid var(--border);
      }
      html[data-nav-style='segmented'] .bottom-nav a:last-child { border-right: none; }
      html[data-nav-style='segmented'] .bottom-nav a.active {
        background: var(--surface-2) !important;
        box-shadow: none !important;
      }

      /* 渐变：用强调色渐变，存在感最强 */
      html[data-nav-style='gradient'] .bottom-nav,
      html[data-nav-style='gradient'][data-theme] .bottom-nav {
        background: linear-gradient(135deg, var(--accent) 0%,
          color-mix(in srgb, var(--accent) 62%, #000) 100%) !important;
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
        border-color: transparent !important;
        box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 34%, transparent) !important;
      }
      html[data-nav-style='gradient'] .bottom-nav a {
        color: rgba(255, 255, 255, 0.82) !important;
        text-shadow: none !important;
      }
      html[data-nav-style='gradient'] .bottom-nav a.active {
        color: #fff !important;
        background: rgba(255, 255, 255, 0.22) !important;
        box-shadow: none !important;
      }

      /* ---------- 导航栏放到顶部 ---------- */
      html[data-nav-pos='top'] .bottom-nav {
        top: calc(10px + env(safe-area-inset-top, 0px));
        bottom: auto;
      }
      html[data-nav-pos='top'] body {
        /* 原本给底部导航留的 112px 改成顶部留白 */
        padding-top: calc(84px + env(safe-area-inset-top, 0px));
        padding-bottom: 16px;
      }
      /* 顶部时给内容区留出与导航相同的高度 */
      html[data-nav-pos='top'] #siteRoot {
        width: 100%;
      }
      @keyframes switchWobble {
        0%   { transform: scale(1); }
        40%  { transform: scale(1.18) rotate(-5deg); }
        70%  { transform: scale(0.94) rotate(2deg); }
        100% { transform: scale(1) rotate(0); }
      }
      .switch.jelly { animation: switchWobble 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

      .bottom-nav a {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 7px 0 6px;
        border-radius: 14px;
        text-decoration: none;
        /* 导航越透明，文字反而越清晰、每个图标越自带底衬，保证任何内容上都能看清 */
        color: color-mix(in srgb, var(--text-faint) calc(var(--nav-op, 0.66) * 100%), var(--text));
        /* 不用背景色块（叠在导航条上会显出一块亮斑），改用文字光晕：
           导航越透明光晕越强，任何内容上文字都清晰，且永远不会出现方块 */
        background: transparent;
        text-shadow: 0 0 calc((1 - var(--nav-op, 0.66)) * 5px)
          rgba(var(--nav-halo, 255, 255, 255), calc((1 - var(--nav-op, 0.66)) * 0.95));
        font-size: 10px;
        font-weight: 700;
        transition: color 0.2s, background 0.2s;
      }
      .bottom-nav a .nav-icon { font-size: 18px; line-height: 1; }
      /* 高亮项不再用 surface-2（深色下比导航条亮很多，会浮出一个方块），
         改用同底色的淡强调色，透不透明都协调 */
      .bottom-nav a.active {
        color: var(--accent);
        background: transparent;
        box-shadow: inset 0 -2.5px 0 var(--accent);
      }

      /* ---------- 全局提示 ---------- */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 96px;
        transform: translate(-50%, 0);
        z-index: 120;
        max-width: 86vw;
        padding: 10px 18px;
        border-radius: 12px;
        background: var(--toast-bg);
        color: #f5f0e6;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s, transform 0.25s;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
    </style>
    <style id="view-style"></style>
    <script>
      /* ---------- 轻量音效（WebAudio 实时合成，无音频文件） ---------- */
      ;(function () {
        let ac = null
        function ctx() {
          if (!ac) {
            const C = window.AudioContext || window.webkitAudioContext
            if (!C) return null
            ac = new C()
          }
          if (ac.state === 'suspended') ac.resume().catch(function () {})
          return ac
        }
        let on = true
        try {
          const v = localStorage.getItem('lw-sfx')
          if (v === '0') on = false
        } catch (e) {}
        const isSilent = () => {
          try {
            return localStorage.getItem('lw-sfx') === '0'
          } catch (e) {
            return false
          }
        }
        /* 一个音符：正弦 + 快速衰减，听起来就是「叮」 */
        function note(freq, at, dur, vol, type) {
          const c = ctx()
          if (!c) return
          const t0 = c.currentTime + at
          const osc = c.createOscillator()
          const gain = c.createGain()
          osc.type = type || 'sine'
          osc.frequency.setValueAtTime(freq, t0)
          gain.gain.setValueAtTime(0.0001, t0)
          gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012)
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur)
          osc.connect(gain)
          gain.connect(c.destination)
          osc.start(t0)
          osc.stop(t0 + dur + 0.02)
        }
        const SFX = {
          /* 轻点：短促柔和的一声 */
          tap: function () {
            note(880, 0, 0.07, 0.05, 'sine')
          },
          /* 成功提示：清亮的双音「叮」 */
          ding: function () {
            note(1318.5, 0, 0.16, 0.09, 'sine')
            note(1760, 0.045, 0.2, 0.07, 'sine')
          },
          /* 撤销：下行两音 */
          undo: function () {
            note(660, 0, 0.08, 0.05, 'triangle')
            note(494, 0.06, 0.12, 0.05, 'triangle')
          },
          /* 弹出：上扬一音 */
          pop: function () {
            note(587, 0, 0.07, 0.05, 'sine')
            note(880, 0.05, 0.1, 0.05, 'sine')
          },
          /* 保存：轻快的一小段 */
          save: function () {
            note(784, 0, 0.09, 0.055, 'sine')
            note(1046.5, 0.07, 0.14, 0.05, 'sine')
          },
          /* 警示：低沉一声，用于清空等破坏性操作 */
          warn: function () {
            note(330, 0, 0.14, 0.06, 'triangle')
          },

          /* ---------- 以下为扩充音效 ---------- */

          /* 开局：轻快上行三音，像打开工具箱 */
          open: function () {
            note(523, 0, 0.07, 0.05, 'sine')
            note(659, 0.055, 0.07, 0.05, 'sine')
            note(784, 0.11, 0.12, 0.05, 'sine')
          },
          /* 关闭：下行两音 */
          close: function () {
            note(659, 0, 0.07, 0.045, 'sine')
            note(440, 0.055, 0.11, 0.045, 'sine')
          },
          /* 切换：极短的一点，用于开关、标签页 */
          tick: function () {
            note(1046, 0, 0.035, 0.035, 'square')
          },
          /* 错误：两声低沉短促 */
          error: function () {
            note(233, 0, 0.09, 0.055, 'sawtooth')
            note(196, 0.1, 0.14, 0.055, 'sawtooth')
          },
          /* 成功：明亮三音，比 ding 更长一点 */
          ok: function () {
            note(880, 0, 0.09, 0.07, 'sine')
            note(1108, 0.07, 0.09, 0.06, 'sine')
            note(1318, 0.14, 0.2, 0.06, 'sine')
          },
          /* 新消息：两粒上行铃音 */
          msg: function () {
            note(988, 0, 0.08, 0.05, 'sine')
            note(1318, 0.07, 0.16, 0.05, 'sine')
          },
          /* 载入：一小段滑上去 */
          load: function () {
            note(392, 0, 0.07, 0.04, 'sine')
            note(523, 0.05, 0.07, 0.04, 'sine')
            note(659, 0.1, 0.07, 0.04, 'sine')
            note(880, 0.15, 0.14, 0.04, 'sine')
          },
          /* 倒计时：短促一声 */
          beep: function () {
            note(784, 0, 0.05, 0.045, 'square')
          },
          /* 加入：欢迎上行的双音 */
          join: function () {
            note(587, 0, 0.08, 0.05, 'sine')
            note(880, 0.07, 0.14, 0.05, 'sine')
          },
          /* 离开：下行双音 */
          leave: function () {
            note(880, 0, 0.08, 0.045, 'sine')
            note(587, 0.07, 0.13, 0.045, 'sine')
          },
          /* 选中：清脆一记 */
          select: function () {
            note(1174, 0, 0.06, 0.05, 'sine')
          },
          /* 导航切页：柔和的一记，谁都能听见但不吵 */
          nav: function () {
            note(1046, 0, 0.05, 0.04, 'sine')
            note(1318, 0.035, 0.09, 0.035, 'sine')
          },
          /* 心跳：低低一记，联机时有人动笔 */
          heartbeat: function () {
            note(196, 0, 0.16, 0.035, 'sine')
          },
        }
        window.sfx = function (name) {
          if (isSilent()) return
          const fn = SFX[name]
          if (fn) {
            try {
              fn()
            } catch (e) {}
          }
        }
        window.setSfx = function (v) {
          on = !!v
          try {
            localStorage.setItem('lw-sfx', v ? '1' : '0')
          } catch (e) {}
          if (v) SFX.tap()
        }
        window.getSfx = function () {
          return !isSilent()
        }
        /* 首次交互解锁音频（浏览器自动播放策略） */
        const unlock = function () {
          ctx()
          document.removeEventListener('pointerdown', unlock)
        }
        document.addEventListener('pointerdown', unlock, { once: true })
      })()
    </script>

  <body>
    <div id="app"></div>
    <div id="toast"></div>
    <script type="module" src="/app.js"></script>
    <script>
      /* ---------- 光尘账本（只走服务端） ----------
         签到和送光尘都是互动行为，一律要求登录。
         早期版本未登录时也存在本机记账，那样换个设备就清零，
         改 localStorage 还能凭空造余额，所以本机账本已整体移除。
         DUST_PER_SIGNIN：每次签到赠送的数量
         DUST_COST：送一次光尘的消耗                    */
      ;(function () {
        var KEY_TOKEN = 'lw-token'
        var DUST_PER_SIGNIN = 5
        var DUST_COST = 1

        // 服务端账本镜像；为 null 表示未登录或尚未拉取
        var server = null
        var inflight = false

        function token() {
          try {
            return localStorage.getItem(KEY_TOKEN) || ''
          } catch (e) {
            return ''
          }
        }
        function applyBook(book) {
          server = book && typeof book.bal === 'number' ? book : null
        }

        /* 拉取服务端账本；未登录或令牌失效时把 server 置空 */
        function sync() {
          var t = token()
          if (!t) {
            applyBook(null)
            return Promise.resolve(null)
          }
          return fetch('/api/dust', { headers: { Authorization: 'Bearer ' + t }, cache: 'no-store' })
            .then(function (r) {
              if (r.status === 401) {
                applyBook(null)
                return null
              }
              return r.json()
            })
            .then(function (d) {
              if (d && d.ok && d.book) applyBook(d.book)
              return server
            })
            .catch(function () {
              return server
            })
        }

        window.dust = {
          perSignin: DUST_PER_SIGNIN,
          cost: DUST_COST,
          /* 是否已登录（账本是否来自服务端） */
          isServer: function () {
            return server !== null
          },
          /* 是否已登录：光尘的一切都以登录为前提 */
          logged: function () {
            return !!token()
          },
          /* 登录/退出后调用 */
          refresh: sync,
          /* 签到：完全由服务端裁决发放 */
          sign: function () {
            var t = token()
            if (!t) return Promise.resolve({ ok: false, needLogin: true })
            if (inflight) return Promise.resolve(null)
            inflight = true
            return fetch('/api/dust', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t },
              body: JSON.stringify({ action: 'sign' }),
            })
              .then(function (r) {
                return r.json().catch(function () {
                  return {}
                })
              })
              .then(function (d) {
                if (d && d.ok && d.book) applyBook(d.book)
                if (d && d.code === 'noauth') applyBook(null)
                return d
              })
              .catch(function () {
                return null
              })
              .finally(function () {
                inflight = false
              })
          },
          /* 赠送：扣分与记账在服务端一次完成 */
          giveRemote: function (time) {
            var t = token()
            if (!t) return Promise.resolve({ ok: false, needLogin: true })
            return fetch('/api/dust', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t },
              body: JSON.stringify({ action: 'give', time: time }),
            })
              .then(function (r) {
                return r.json().catch(function () {
                  return {}
                })
              })
              .then(function (d) {
                if (d && d.book) applyBook(d.book)
                if (d && d.code === 'noauth') applyBook(null)
                return d
              })
              .catch(function () {
                return null
              })
          },
          balance: function () {
            return server ? Math.max(0, server.bal) : 0
          },
          /* 累计收到的光尘（别人送到自己作品上的） */
          received: function () {
            return server ? Number(server.got) || 0 : 0
          },
          /* 未登录一律视为没送过，避免误显示「已送」 */
          gave: function (time) {
            if (!server) return false
            var k = String(time)
            return Array.isArray(server.gifted) && server.gifted.indexOf(k) >= 0
          },
          giftedList: function () {
            return server && Array.isArray(server.gifted) ? server.gifted : []
          },
          giftedCount: function () {
            return server ? Number(server.giftedCount) || 0 : 0
          },
          /* 服务端账本里的签到状态，供「我的」页渲染 */
          signState: function () {
            return server
              ? { signed: !!server.signedToday, streak: server.streak || 0, total: server.total || 0 }
              : null
          },
        }
        // 启动时静默拉一次，登录用户直接显示真实余额
        sync()
      })()

      /* ---------- 成就提示 ----------
         成就要在「做完事之后」就通知，而不是等用户特意去成就页才发现。
         所以发布作品、送出光尘、签到之后都调 window.achSync()，
         它去服务端重新统计，有新解锁就弹提示。 */
      ;(function () {
        var KEY_TOKEN = 'lw-token'
        var busy = false
        var STYLE_ID = 'lw-ach-style'
        var BOX_ID = 'lw-ach-box'

        function token() {
          try {
            return localStorage.getItem(KEY_TOKEN) || ''
          } catch (e) {
            return ''
          }
        }

        function ensureStyle() {
          if (document.getElementById(STYLE_ID)) return
          var st = document.createElement('style')
          st.id = STYLE_ID
          st.textContent =
            '#' + BOX_ID + '{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));' +
            'transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;' +
            'width:min(320px,88vw);pointer-events:none}' +
            '.lw-ach{background:var(--surface,#fff);border:1px solid var(--accent,#5b8def);' +
            'border-radius:14px;padding:11px 13px;box-shadow:0 8px 26px rgba(0,0,0,.18);' +
            'display:flex;gap:10px;align-items:flex-start;' +
            'animation:lwAchIn .3s ease;transition:opacity .3s,transform .3s}' +
            '.lw-ach.out{opacity:0;transform:translateY(-8px)}' +
            '@keyframes lwAchIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}' +
            '.lw-ach-ico{font-size:24px;line-height:1.2;flex:none}' +
            '.lw-ach-b{flex:1;min-width:0}' +
            '.lw-ach-t{font-size:12px;font-weight:800;color:var(--accent,#5b8def);letter-spacing:.4px}' +
            '.lw-ach-n{font-size:14px;font-weight:800;color:var(--text,#222);margin-top:2px;line-height:1.4}' +
            '.lw-ach-d{font-size:12px;color:var(--text-muted,#888);margin-top:2px;line-height:1.5}' +
            '.lw-ach-r{display:inline-block;margin-top:5px;font-size:11px;font-weight:800;color:#b8860b}'
          document.head.appendChild(st)
        }

        function box() {
          ensureStyle()
          var b = document.getElementById(BOX_ID)
          if (!b) {
            b = document.createElement('div')
            b.id = BOX_ID
            document.body.appendChild(b)
          }
          return b
        }

        function esc(t) {
          return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
          })
        }

        /* 弹一条成就提示；同一批多个会依次堆叠 */
        function show(list, reward) {
          if (!list || !list.length) return
          var host = box()
          list.slice(0, 4).forEach(function (a, i) {
            var el = document.createElement('div')
            el.className = 'lw-ach'
            el.innerHTML =
              '<div class="lw-ach-ico">' + esc(a.ico || '🏅') + '</div>' +
              '<div class="lw-ach-b">' +
              '<div class="lw-ach-t">成就达成</div>' +
              '<div class="lw-ach-n">' + esc(a.name) + '</div>' +
              '<div class="lw-ach-d">' + esc(a.desc || '') + '</div>' +
              (a.reward ? '<div class="lw-ach-r">+' + a.reward + ' ✨ 光尘</div>' : '') +
              '</div>'
            host.appendChild(el)
            setTimeout(function () {
              el.classList.add('out')
              setTimeout(function () {
                if (el.parentNode) el.parentNode.removeChild(el)
              }, 320)
            }, 3200 + i * 180)
          })
          if (window.sfx) {
            try {
              window.sfx('ok')
            } catch (e) {}
          }
          // 奖励光尘已由服务端加到账本上，通知余额刷新
          if (reward) window.dispatchEvent(new CustomEvent('lw-dust-changed'))
          window.dispatchEvent(new CustomEvent('lw-achieve-changed', { detail: list }))
        }

        /**
         * 重新统计成就并提示。
         * opts.silent 为 true 时只静默同步（例如角标刷新），不弹提示。
         * opts.then 回调拿到完整结果。
         */
        window.achSync = function (opts) {
          var o = opts || {}
          var t = token()
          if (!t) return Promise.resolve(null)
          if (busy) {
            return o.then ? Promise.resolve(null) : Promise.resolve(null)
          }
          busy = true
          return fetch('/api/achieve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t },
            body: JSON.stringify({ action: 'sync' }),
            cache: 'no-store',
          })
            .then(function (r) {
              if (r.status === 401) return null
              return r.json().catch(function () {
                return null
              })
            })
            .then(function (d) {
              if (d && d.ok && !o.silent && d.fresh && d.fresh.length) show(d.fresh, d.reward)
              if (o.then && d) o.then(d)
              return d
            })
            .catch(function () {
              return null
            })
            .finally(function () {
              busy = false
            })
        }

        // 成就页在别处被打开过时，角标要跟着变
        window.addEventListener('lw-achieve-changed', function () {})
      })()

      /* ---------- 导航栏样式/位置：尽早应用，避免刷新后闪一下默认值 ---------- */
      ;(function () {
        try {
          var st = localStorage.getItem('lw-nav-style')
          if (st) document.documentElement.setAttribute('data-nav-style', st)
        } catch (e) {}
      })()

      /* ---------- 导航栏位置：尽早应用 ---------- */
      ;(function () {
        try {
          if (localStorage.getItem('lw-nav-pos') === 'top') {
            document.documentElement.setAttribute('data-nav-pos', 'top')
          }
        } catch (e) {}
      })()

      /* ---------- 底部导航透明度：尽早应用，避免刷新后闪一下默认值 ---------- */
      ;(function () {
        try {
          var raw = localStorage.getItem('lw-nav-op')
          if (raw !== null && raw !== '') {
            var n = Math.max(0, Math.min(100, Number(raw) || 0))
            document.documentElement.style.setProperty('--nav-op', (n / 100).toFixed(3))
          }
        } catch (e) {}
      })()

      /* ---------- PWA：注册 Service Worker，支持离线使用 ---------- */
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {})
        })
      }

      /* 安装到桌面：Android/桌面 Chrome 走 beforeinstallprompt */
      ;(function () {
        var deferred = null
        var KEY = 'lw-pwa-hint-dismissed'
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault()
          deferred = e
          try { if (localStorage.getItem(KEY) === '1') return } catch (err) {}
          if (!document.body) return
          var tip = document.createElement('div')
          tip.className = 'pwa-tip'
          tip.innerHTML =
            '<span>把像素小镇装到桌面，没网也能画画</span>' +
            '<button class="pwa-go" type="button">安装</button>' +
            '<button class="pwa-x" type="button" aria-label="关闭">×</button>'
          document.body.appendChild(tip)
          tip.querySelector('.pwa-go').addEventListener('click', function () {
            tip.remove()
            if (deferred) {
              deferred.prompt()
              deferred.userChoice.then(function () { deferred = null })
            }
          })
          tip.querySelector('.pwa-x').addEventListener('click', function () {
            try { localStorage.setItem(KEY, '1') } catch (err) {}
            tip.remove()
          })
        })
        window.addEventListener('appinstalled', function () {
          try { localStorage.setItem(KEY, '1') } catch (err) {}
          if (window.toast) window.toast('已添加到桌面，以后可以直接打开 🎉')
        })
      })()
    </script>
