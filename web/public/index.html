    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('lw-theme')
          if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', t)
          if (localStorage.getItem('lw-glass') === '0') document.documentElement.classList.add('glass-off')
        } catch (e) {}
      })()

    <style>

      /* ---------- PWA 安装提示条 ---------- */
      .pwa-tip {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: calc(74px + env(safe-area-inset-bottom, 0px));
        z-index: 900;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 11px 13px;
        border-radius: 14px;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        box-shadow: 0 6px 22px var(--shadow1);
        font-size: 13px;
        color: var(--text);
        max-width: 460px;
        margin: 0 auto;
      }
      .pwa-tip span { flex: 1; line-height: 1.5; }
      .pwa-go {
        padding: 7px 14px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
      }
      .pwa-x {
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        border-radius: 50%;
        border: none;
        background: var(--surface-2);
        color: var(--text-muted);
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      html { background: var(--bg); overflow-x: clip; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        /* 不设这一行时 body 用浏览器默认的纯黑，深色模式下会变成黑字黑底 */
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        padding: 16px 16px 112px;
        transition: background 0.25s ease, color 0.25s ease;
        overflow-x: clip;
      }

      /* 让表单控件、滚动条也跟着主题走 */
      :root { color-scheme: light; }
      html[data-theme="dark"] { color-scheme: dark; }
      html[data-theme="midnight"] { color-scheme: dark; }

      /* 路由出口用 display:contents 彻底"透明"：
         各视图的根元素直接参与 body 的布局，与迁移前的单文件页面完全一致。
         （外壳不设 display:flex，因为原本只有画板/联机/管理是 flex 布局，
           社区/日志/设置原本是块级布局，强行统一会导致宽度算错） */
      #siteRoot { display: contents; }

      /* 关键：#app 是 Vue 挂载点，也是 body 的 flex 子项。
         align-items:center 会让它按内容宽度收缩（本项目最宽元素是 460px），
         于是页面内所有 width:100% 都相对 460px 解析，在窄屏上整体超宽。
         把它钉死为可视宽度，各视图的 width:100% 才会正确。 */
      #app {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* 兜底：极老浏览器不支持 display:contents 时，用 block+100% 保持同样宽度 */
      @supports not (display: contents) {
        #siteRoot { display: block; width: 100%; }
      }

      /* ---------- 底部导航（全局壳，四个页面共用） ---------- */
      .bottom-nav {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 80;
        display: flex;
        align-items: center;
        gap: 2px;
        width: min(420px, calc(100% - 36px));
        padding: 8px 12px;
        background: rgba(255, 253, 250, 0.66) !important;
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(180, 168, 150, 0.30) !important;
        border-radius: 999px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      [data-theme="dark"] .bottom-nav {
        background: rgba(42, 38, 33, 0.62) !important;
        border-color: rgba(255, 255, 255, 0.10) !important;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      html.glass-off .bottom-nav,
      html.glass-off [data-theme="dark"] .bottom-nav {
        background: var(--surface) !important;
        border-color: var(--border) !important;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }

      @keyframes glassJelly {
        0%   { transform: translateX(-50%) scale(1, 0.98) translateY(5px); }
        30%  { transform: translateX(-50%) scale(1.04, 0.99) translateY(-4px); }
        55%  { transform: translateX(-50%) scale(0.985, 1.012) translateY(3px); }
        78%  { transform: translateX(-50%) scale(1.01, 0.997) translateY(-1px); }
        100% { transform: translateX(-50%) scale(1, 1) translateY(0); }
      }
      .bottom-nav.jelly { animation: glassJelly 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
      @keyframes switchWobble {
        0%   { transform: scale(1); }
        40%  { transform: scale(1.18) rotate(-5deg); }
        70%  { transform: scale(0.94) rotate(2deg); }
        100% { transform: scale(1) rotate(0); }
      }
      .switch.jelly { animation: switchWobble 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

      .bottom-nav a {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 7px 0 6px;
        border-radius: 14px;

        transition: color 0.2s, background 0.2s;

      .bottom-nav a .nav-icon { font-size: 18px; line-height: 1; }
      .bottom-nav a.active { color: var(--accent); background: var(--surface-2); }

      /* ---------- 全局提示 ---------- */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 96px;
        transform: translate(-50%, 0);
        z-index: 120;
        max-width: 86vw;
        padding: 10px 18px;
        border-radius: 12px;
        background: var(--toast-bg);
        color: #f5f0e6;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s, transform 0.25s;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }

    <style id="view-style"></style>
    <script>
      /* ---------- 轻量音效（WebAudio 实时合成，无音频文件） ---------- */
      ;(function () {
        let ac = null
        function ctx() {
          if (!ac) {
            const C = window.AudioContext || window.webkitAudioContext
            if (!C) return null
            ac = new C()
          }
          if (ac.state === 'suspended') ac.resume().catch(function () {})
          return ac
        }
        let on = true
        try {
          const v = localStorage.getItem('lw-sfx')
          if (v === '0') on = false
        } catch (e) {}
        const isSilent = () => {
          try {
            return localStorage.getItem('lw-sfx') === '0'
          } catch (e) {
            return false
          }
        }
        /* 一个音符：正弦 + 快速衰减，听起来就是「叮」 */
        function note(freq, at, dur, vol, type) {
          const c = ctx()
          if (!c) return
          const t0 = c.currentTime + at
          const osc = c.createOscillator()
          const gain = c.createGain()
          osc.type = type || 'sine'
          osc.frequency.setValueAtTime(freq, t0)
          gain.gain.setValueAtTime(0.0001, t0)
          gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012)
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur)
          osc.connect(gain)
          gain.connect(c.destination)
          osc.start(t0)
          osc.stop(t0 + dur + 0.02)
        }
        const SFX = {
          /* 轻点：短促柔和的一声 */
          tap: function () {
            note(880, 0, 0.07, 0.05, 'sine')
          },
          /* 成功提示：清亮的双音「叮」 */
          ding: function () {
            note(1318.5, 0, 0.16, 0.09, 'sine')
            note(1760, 0.045, 0.2, 0.07, 'sine')
          },
          /* 撤销：下行两音 */
          undo: function () {
            note(660, 0, 0.08, 0.05, 'triangle')
            note(494, 0.06, 0.12, 0.05, 'triangle')
          },
          /* 弹出：上扬一音 */
          pop: function () {
            note(587, 0, 0.07, 0.05, 'sine')
            note(880, 0.05, 0.1, 0.05, 'sine')
          },
          /* 保存：轻快的一小段 */
          save: function () {
            note(784, 0, 0.09, 0.055, 'sine')
            note(1046.5, 0.07, 0.14, 0.05, 'sine')
          },
          /* 警示：低沉一声，用于清空等破坏性操作 */
          warn: function () {
            note(330, 0, 0.14, 0.06, 'triangle')
          },

          /* ---------- 以下为扩充音效 ---------- */

          /* 开局：轻快上行三音，像打开工具箱 */
          open: function () {
            note(523, 0, 0.07, 0.05, 'sine')
            note(659, 0.055, 0.07, 0.05, 'sine')
            note(784, 0.11, 0.12, 0.05, 'sine')
          },
          /* 关闭：下行两音 */
          close: function () {
            note(659, 0, 0.07, 0.045, 'sine')
            note(440, 0.055, 0.11, 0.045, 'sine')
          },
          /* 切换：极短的一点，用于开关、标签页 */
          tick: function () {
            note(1046, 0, 0.035, 0.035, 'square')
          },
          /* 错误：两声低沉短促 */
          error: function () {
            note(233, 0, 0.09, 0.055, 'sawtooth')
            note(196, 0.1, 0.14, 0.055, 'sawtooth')
          },
          /* 成功：明亮三音，比 ding 更长一点 */
          ok: function () {
            note(880, 0, 0.09, 0.07, 'sine')
            note(1108, 0.07, 0.09, 0.06, 'sine')
            note(1318, 0.14, 0.2, 0.06, 'sine')
          },
          /* 新消息：两粒上行铃音 */
          msg: function () {
            note(988, 0, 0.08, 0.05, 'sine')
            note(1318, 0.07, 0.16, 0.05, 'sine')
          },
          /* 载入：一小段滑上去 */
          load: function () {
            note(392, 0, 0.07, 0.04, 'sine')
            note(523, 0.05, 0.07, 0.04, 'sine')
            note(659, 0.1, 0.07, 0.04, 'sine')
            note(880, 0.15, 0.14, 0.04, 'sine')
          },
          /* 倒计时：短促一声 */
          beep: function () {
            note(784, 0, 0.05, 0.045, 'square')
          },
          /* 加入：欢迎上行的双音 */
          join: function () {
            note(587, 0, 0.08, 0.05, 'sine')
            note(880, 0.07, 0.14, 0.05, 'sine')
          },
          /* 离开：下行双音 */
          leave: function () {
            note(880, 0, 0.08, 0.045, 'sine')
            note(587, 0.07, 0.13, 0.045, 'sine')
          },
          /* 选中：清脆一记 */
          select: function () {
            note(1174, 0, 0.06, 0.05, 'sine')
          },
          /* 心跳：低低一记，联机时有人动笔 */
          heartbeat: function () {
            note(196, 0, 0.16, 0.035, 'sine')
          },
        }
        window.sfx = function (name) {
          if (isSilent()) return
          const fn = SFX[name]
          if (fn) {
            try {
              fn()
            } catch (e) {}
          }
        }
        window.setSfx = function (v) {
          on = !!v
          try {
            localStorage.setItem('lw-sfx', v ? '1' : '0')
          } catch (e) {}
          if (v) SFX.tap()
        }
        window.getSfx = function () {
          return !isSilent()
        }
        /* 首次交互解锁音频（浏览器自动播放策略） */
        const unlock = function () {
          ctx()
          document.removeEventListener('pointerdown', unlock)
        }
        document.addEventListener('pointerdown', unlock, { once: true })
      })()
    </script>

  <body>
    <div id="app"></div>
    <div id="toast"></div>
    <script type="module" src="/app.js"></script>
    <script>
      /* ---------- PWA：注册 Service Worker，支持离线使用 ---------- */
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {})
        })
      }

      /* 安装到桌面：Android/桌面 Chrome 走 beforeinstallprompt */
      ;(function () {
        var deferred = null
        var KEY = 'lw-pwa-hint-dismissed'
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault()
          deferred = e
          try { if (localStorage.getItem(KEY) === '1') return } catch (err) {}
          if (!document.body) return
          var tip = document.createElement('div')
          tip.className = 'pwa-tip'
          tip.innerHTML =
            '<span>把像素小镇装到桌面，没网也能画画</span>' +
            '<button class="pwa-go" type="button">安装</button>' +
            '<button class="pwa-x" type="button" aria-label="关闭">×</button>'
          document.body.appendChild(tip)
          tip.querySelector('.pwa-go').addEventListener('click', function () {
            tip.remove()
            if (deferred) {
              deferred.prompt()
              deferred.userChoice.then(function () { deferred = null })
            }
          })
          tip.querySelector('.pwa-x').addEventListener('click', function () {
            try { localStorage.setItem(KEY, '1') } catch (err) {}
            tip.remove()
          })
        })
        window.addEventListener('appinstalled', function () {
          try { localStorage.setItem(KEY, '1') } catch (err) {}
          if (window.toast) window.toast('已添加到桌面，以后可以直接打开 🎉')
        })
      })()
    </script>
  </body>
