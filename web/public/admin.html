<!DOCTYPE html>
<html lang="zh-hans">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 | 光域画板</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(160deg, #fdf8f2 0%, #f2ece2 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 16px 48px;
      }

      h1 {
        font-size: 22px;
        font-weight: 700;
        color: #3b342c;
        margin: 8px 0 20px;
        letter-spacing: 1px;
      }

      .card {
        width: 100%;
        max-width: 460px;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 8px 24px rgba(80, 60, 40, 0.12);
        padding: 20px;
        margin-bottom: 16px;
      }

      .card-title {
        font-size: 14px;
        font-weight: 600;
        color: #9a8c7a;
        margin-bottom: 14px;
      }

      .login input {
        width: 100%;
        height: 48px;
        border-radius: 14px;
        border: 2px solid #e0d8d0;
        padding: 0 14px;
        font-size: 15px;
        background: #fbfaf8;
        outline: none;
        color: #3b342c;
      }

      .login input:focus { border-color: #5b8def; }

      .login .enter {
        width: 100%;
        height: 48px;
        margin-top: 12px;
        border-radius: 14px;
        border: none;
        background: #5b8def;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }

      .latest {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .latest canvas {
        width: 110px;
        height: 110px;
        image-rendering: pixelated;
        border-radius: 12px;
        border: 2px solid rgba(0, 0, 0, 0.08);
        background: #fff;
      }

      .latest-info { flex: 1; min-width: 0; }

      .latest-info .author {
        font-size: 17px;
        font-weight: 700;
        color: #3b342c;
      }

      .latest-info .time {
        font-size: 13px;
        color: #b0a697;
        margin-top: 4px;
      }

      .entry {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid #f0ece4;
      }

      .entry:last-child { border-bottom: none; }

      .entry canvas {
        width: 48px;
        height: 48px;
        flex: 0 0 48px;
        image-rendering: pixelated;
        border-radius: 8px;
        border: 2px solid rgba(0, 0, 0, 0.08);
        background: #fff;
      }

      .entry .info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .entry .author {
        font-size: 14px;
        font-weight: 600;
        color: #3b342c;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .entry .time {
        font-size: 11px;
        color: #b0a697;
      }

      .del {
        border: none;
        border-radius: 999px;
        background: #fdeceb;
        color: #d34b3f;
        font-size: 13px;
        font-weight: 600;
        padding: 8px 16px;
        cursor: pointer;
      }

      .empty {
        font-size: 13px;
        color: #b0a697;
        padding: 6px 2px;
      }

      .clear {
        width: 100%;
        height: 50px;
        border-radius: 16px;
        border: none;
        background: #d34b3f;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }

      .logout {
        margin-top: 12px;
        width: 100%;
        height: 44px;
        border-radius: 14px;
        border: none;
        background: #efe9e0;
        color: #6b5f50;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      #toast {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translate(-50%, 16px);
        background: #3b342c;
        color: #fff;
        padding: 12px 22px;
        border-radius: 999px;
        font-size: 15px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        max-width: 86vw;
        text-align: center;
        z-index: 10;
      }

      #toast.show { opacity: 1; transform: translate(-50%, 0); }

      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <h1>光域画板 · 管理后台</h1>

    <div class="card login" id="loginCard">
      <div class="card-title">输入管理员密码</div>
      <input id="passInput" type="password" placeholder="ADMIN_KEY">
      <button class="enter" id="enterBtn" type="button">进入</button>
    </div>

    <div id="panel" hidden>
      <div class="card">
        <div class="card-title">最新作品</div>
        <div class="latest" id="latestWrap">
          <div class="empty">暂无数据</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">历史记录（最多 10 条）</div>
        <div id="entryList"></div>
      </div>

      <div class="card">
        <button class="clear" id="clearAllBtn" type="button">一键清空全部</button>
      </div>

      <button class="logout" id="logoutBtn" type="button">退出登录</button>
    </div>

    <div id="toast"></div>

    <script>
      const passInput = document.getElementById('passInput')
      const enterBtn = document.getElementById('enterBtn')
      const loginCard = document.getElementById('loginCard')
      const panel = document.getElementById('panel')
      const latestWrap = document.getElementById('latestWrap')
      const entryList = document.getElementById('entryList')
      const clearAllBtn = document.getElementById('clearAllBtn')
      const logoutBtn = document.getElementById('logoutBtn')

      const KEY = 'adminKey'
      const dpr = window.devicePixelRatio || 1

      function getKey() {
        return sessionStorage.getItem(KEY) || ''
      }

      function setKey(k) {
        sessionStorage.setItem(KEY, k)
      }

      function clearKey() {
        sessionStorage.removeItem(KEY)
      }

      function formatTime(ts) {
        if (!ts) return ''
        const d = new Date(ts)
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`
      }

      function drawThumb(canvas, pixels) {
        canvas.width = 16 * dpr
        canvas.height = 16 * dpr
        const c = canvas.getContext('2d')
        c.scale(dpr, dpr)
        c.clearRect(0, 0, 16, 16)
        for (let y = 0; y < 16; y++) {
          for (let x = 0; x < 16; x++) {
            const px = pixels && pixels[y * 16 + x]
            if (!px) continue
            c.fillStyle = `rgb(${px[0]}, ${px[1]}, ${px[2]})`
            c.fillRect(x, y, 1, 1)
          }
        }
      }

      async function verify(key) {
        const res = await fetch('/api/admin/verify', {
          headers: { 'x-admin-key': key },
        })
        return res.ok
      }

      async function login() {
        const key = passInput.value.trim()
        if (!key) {
          toast('请输入密码')
          return
        }
        enterBtn.disabled = true
        try {
          if (await verify(key)) {
            setKey(key)
            loginCard.hidden = true
            panel.hidden = false
            passInput.value = ''
            toast('登录成功')
            refresh()
          } else {
            toast('密码错误')
          }
        } catch (err) {
          toast('网络错误')
        } finally {
          enterBtn.disabled = false
        }
      }

      enterBtn.addEventListener('click', login)
      passInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') login()
      })

      logoutBtn.addEventListener('click', () => {
        clearKey()
        panel.hidden = true
        loginCard.hidden = false
      })

      async function refresh() {
        try {
          const res = await fetch('/api/get')
          if (!res.ok) {
            toast('获取数据失败')
            return
          }
          const data = await res.json()
          renderLatest(data)
          renderList(data.history || [])
        } catch (err) {
          toast('网络错误')
        }
      }

      function renderLatest(data) {
        latestWrap.innerHTML = ''
        if (!data.pixels) {
          const empty = document.createElement('div')
          empty.className = 'empty'
          empty.textContent = '暂无数据'
          latestWrap.appendChild(empty)
          return
        }
        const canvas = document.createElement('canvas')
        drawThumb(canvas, data.pixels)

        const info = document.createElement('div')
        info.className = 'latest-info'
        const author = document.createElement('div')
        author.className = 'author'
        author.textContent = data.name || '匿名'
        const time = document.createElement('div')
        time.className = 'time'
        time.textContent = formatTime(data.time)
        info.append(author, time)

        latestWrap.append(canvas, info)
      }

      function renderList(records) {
        entryList.innerHTML = ''
        if (!records.length) {
          const empty = document.createElement('div')
          empty.className = 'empty'
          empty.textContent = '暂无历史记录'
          entryList.appendChild(empty)
          return
        }
        records.forEach((rec) => {
          const row = document.createElement('div')
          row.className = 'entry'

          const canvas = document.createElement('canvas')
          drawThumb(canvas, rec.pixels)

          const info = document.createElement('div')
          info.className = 'info'
          const author = document.createElement('span')
          author.className = 'author'
          author.textContent = rec.name || '匿名'
          const time = document.createElement('span')
          time.className = 'time'
          time.textContent = formatTime(rec.time)
          info.append(author, time)

          const del = document.createElement('button')
          del.type = 'button'
          del.className = 'del'
          del.textContent = '删除'
          del.addEventListener('click', () => removeEntry(rec))

          row.append(canvas, info, del)
          entryList.appendChild(row)
        })
      }

      async function removeEntry(rec) {
        const label = rec.name || '匿名'
        if (!window.confirm(`确定删除「${label}」的作品吗？`)) return

        const key = getKey()
        if (!key) {
          toast('请先登录')
          return
        }
        try {
          const res = await fetch('/api/admin/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
            body: JSON.stringify({ time: rec.time }),
          })
          if (!res.ok) {
            toast((await res.json().catch(() => ({}))).error || '删除失败')
            return
          }
          toast('已删除')
          refresh()
        } catch (err) {
          toast('网络错误')
        }
      }

      clearAllBtn.addEventListener('click', async () => {
        if (!window.confirm('确定清空全部数据吗？此操作不可恢复！')) return

        const key = getKey()
        if (!key) {
          toast('请先登录')
          return
        }
        try {
          const res = await fetch('/api/admin/clear', {
            method: 'POST',
            headers: { 'x-admin-key': key },
          })
          if (!res.ok) {
            toast((await res.json().catch(() => ({}))).error || '清空失败')
            return
          }
          toast('已清空全部')
          refresh()
        } catch (err) {
          toast('网络错误')
        }
      })

      let toastTimer
      function toast(msg) {
        const el = document.getElementById('toast')
        el.textContent = msg
        el.classList.add('show')
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => el.classList.remove('show'), 2200)
      }

      if (getKey()) {
        verify(getKey()).then((ok) => {
          if (ok) {
            loginCard.hidden = true
            panel.hidden = false
            refresh()
          } else {
            clearKey()
          }
        })
      }
    </script>
  </body>
</html>
